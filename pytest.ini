[pytest]
testpaths = tests
markers =
    smoke: 冒烟用例
    web: Web 端用例（依赖 Playwright）
    api: 接口用例
    mobile: 移动端用例（依赖 Appium，无环境自动跳过）
    perf: 性能基线用例
    external: 依赖外网的用例，默认不跑（pytest -m external 手动触发）
addopts =
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html
filterwarnings =
    ignore::DeprecationWarning
